    <canvas id="game"></canvas>
    <div id="loading">
      <div class="box">
        <div class="bar"><i id="load-bar"></i></div>
        <div id="load-text" hidden></div>
      </div>
    </div>
    <script>
      { // before the 2 MB game script arrives: a readable error instead of a frozen bar
        const fail = msg => { const l = document.getElementById('loading'); if (!l || l.classList.contains('done')) return
          const t = document.getElementById('load-text'); l.classList.add('error'); t.hidden = false
          t.textContent = 'Не вдалося завантажити гру — оновіть сторінку'; t.title = String(msg).slice(0, 200) }
        addEventListener('error', e => fail(e.message || 'не вдалося завантажити'))
        addEventListener('unhandledrejection', e => fail(String(e.reason?.message ?? e.reason)))
      }
    </script>
