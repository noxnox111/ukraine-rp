    <style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;background:#000;height:100%;margin:0;overflow:hidden}#game{outline:none;width:100%;height:100%;display:block}#hud{color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;font:600 16px system-ui,sans-serif;position:fixed;top:10px;left:12px}#net{color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;align-items:center;gap:8px;font:600 13px system-ui,sans-serif;display:flex;position:fixed;top:36px;left:12px}#net button{pointer-events:auto;color:#fff;height:32px;font:inherit;text-shadow:none;touch-action:manipulation;background:#0006;border:1px solid #fff8;border-radius:16px;padding:0 14px}#net [hidden]{display:none}#net-toast{font-weight:500}#invite-panel{background:#000a;border-radius:12px;align-items:center;gap:6px;max-width:calc(100vw - 24px);padding:6px;display:flex;position:fixed;top:74px;left:12px}#invite-panel[hidden]{display:none}#invite-panel input{color:#fff;-webkit-user-select:text;user-select:text;background:#fff1;border:1px solid #fff6;border-radius:8px;width:min(360px,52vw);height:30px;padding:0 8px;font:13px system-ui,sans-serif}#invite-panel button{color:#fff;touch-action:manipulation;background:#0006;border:1px solid #fff8;border-radius:16px;height:32px;padding:0 12px;font:600 13px system-ui,sans-serif}#osm{color:#fff;opacity:.75;text-shadow:0 1px 2px #000;align-items:center;gap:6px;font:11px system-ui,sans-serif;display:flex;position:fixed;bottom:4px;left:6px}#osm a{color:inherit}#osm button{color:#fff;touch-action:manipulation;background:#0005;border:0;border-radius:50%;width:18px;height:18px;padding:0;font:12px/18px system-ui,sans-serif}#osm:not(.open) span{display:none}.pad{gap:14px;display:flex;position:fixed;bottom:24px}.pad.left{left:20px}.pad.right{right:20px}.pad button,#reset{color:#fff;touch-action:none;background:#0006;border:2px solid #fff8;border-radius:50%;width:72px;height:72px;font-size:26px}.pad button.on{background:#fff4}#reset{width:48px;height:48px;font-size:20px;position:fixed;top:10px;right:12px}@media (hover:hover) and (pointer:fine){.pad{display:none}}#loading{z-index:10;box-sizing:border-box;color:#fff;background:radial-gradient(at 50% 40%,#1b2a44 0%,#0b111c 60%,#05070b 100%);justify-content:center;align-items:center;padding:16px;font:15px system-ui,sans-serif;transition:opacity .5s;display:flex;position:fixed;inset:0}#loading.done{opacity:0;pointer-events:none}#loading .box{text-align:center;width:min(340px,100%)}#loading .title{letter-spacing:.02em;font:800 34px system-ui,sans-serif}#loading .sub{opacity:.65;margin-top:4px}#loading .bar{background:#ffffff1f;border-radius:4px;height:8px;margin:28px 0 12px;overflow:hidden}#loading .bar i{background:linear-gradient(90deg,#0057b7,#4d8fe0 55%,gold);border-radius:4px;width:3%;height:100%;transition:width .35s ease-out;display:block}#load-text{min-height:1.3em}#loading .room{opacity:.8;margin-top:10px;font-size:13px}#loading .hint{opacity:.45;margin-top:22px;font-size:12px}#loading .credit{text-align:center;opacity:.4;font-size:11px;position:absolute;bottom:10px;left:0;right:0}#loading.error #load-text{color:#ff8a80}</style>

  <body>
    <canvas id="game"></canvas>
    <div id="loading">
      <div class="box">
        <div class="title">Ukraine RP</div>
        <div class="sub">Київ · Позняки</div>
        <div class="bar"><i id="load-bar"></i></div>
        <div id="load-text">Завантаження гри…</div>
        <div class="room" id="load-room" hidden></div>
        <div class="hint">Перший запуск на телефоні може тривати до хвилини</div>
      </div>
      <div class="credit">© OpenStreetMap contributors · Meta &amp; WRI CHMv2 (CC BY 4.0)</div>
    </div>
    <script>
      { // before the 2 MB game script arrives: which room, and a readable error instead of a frozen bar
        const room = new URLSearchParams(location.search).get('room'), el = document.getElementById('load-room')
        if (room) { el.textContent = 'Кімната: ' + room.slice(0, 40); el.hidden = false }
        const fail = msg => { const l = document.getElementById('loading'); if (!l || l.classList.contains('done')) return
          l.classList.add('error'); document.getElementById('load-text').textContent = 'Не вдалося завантажити гру — оновіть сторінку'
          const d = document.getElementById('load-room'); d.hidden = false; d.textContent = String(msg).slice(0, 120) }
        addEventListener('error', e => fail(e.message || 'не вдалося завантажити'))
        addEventListener('unhandledrejection', e => fail(String(e.reason?.message ?? e.reason)))
      }
    </script>
    <div id="hud"></div>
    <div id="net"><span id="net-status"></span><button id="invite" hidden>Запросити</button><span id="net-toast" hidden></span></div>
    <div id="osm" class="open"><button type="button" aria-label="Джерела даних" onclick="this.parentNode.classList.toggle('open'); this.blur()">ⓘ</button><span>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · trees: <a href="https://registry.opendata.aws/dataforgood-fb-forestsv2/" target="_blank" rel="noopener">Meta &amp; WRI CHMv2</a>, CC BY 4.0 (derived)</span></div>

    <div class="pad right"><button data-key="back">▼</button><button data-key="gas">▲</button></div>
